name: 📰 New news source or category
description: Propose a Swiss publisher or a feed to add
title: "[Source]: "
labels: ["enhancement", "content"]
body:
  - type: markdown
    attributes:
      value: |
        The app reads public RSS feeds. A proposal is much easier to act on
        when it comes with the actual feed URL.

  - type: input
    id: publisher
    attributes:
      label: Publisher
      placeholder: Der Bund
    validations:
      required: true

  - type: input
    id: feed-url
    attributes:
      label: RSS feed URL
      description: The direct feed URL, not the website. Please check it loads in a browser.
      placeholder: https://example.ch/rubrik.rss
    validations:
      required: true

  - type: dropdown
    id: group
    attributes:
      label: Which group does it belong to?
      options:
        - News
        - Sport
        - Wissen / Knowledge
        - Kultur / Culture
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - German
        - French
        - Italian
        - Romansh
        - English
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: The feed is publicly accessible without a login or paywall
          required: true
        - label: The feed includes article images (nice to have, not required)
          required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: For an existing publisher, say which category is missing.
    validations:
      required: false
