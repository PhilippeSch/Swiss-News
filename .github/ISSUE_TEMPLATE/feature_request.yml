name: ✨ Feature request
description: Suggest a new capability or an improvement to an existing one
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Screen space and battery are scarce on a watch, so the best proposals
        explain the need first and the solution second.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not the solution you have in mind.
      placeholder: On my commute I want yesterday's evening news, but the time filter only reaches back 48 hours.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      placeholder: A "7 days" option in the time filter.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Home screen / category list
        - Article list within a category
        - Reading an article
        - Settings (sources, categories, time filter)
        - A new news source
        - Complication or widget
        - Notifications
        - Offline / caching
        - Accessibility
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including "I currently work around it by …".
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How much does this matter to you?
      options:
        - Nice to have
        - Would noticeably improve my daily use
        - I avoid using the app because of this
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Sketches, mockups, or references
      description: If another app does this well, a screenshot helps.
    validations:
      required: false
